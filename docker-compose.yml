services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: protoverse
    ports:
      - "5433:5432"
    volumes:
      - protoverse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.1
    volumes:
      - ./db/migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - "-path=/migrations"
      - "-database=postgres://postgres:devpass@postgres:5432/protoverse?sslmode=disable"
      - "up"
    restart: "no"

  api:
    build:
      context: .
      target: api
    environment:
      DB_URL: "postgres://postgres:devpass@postgres:5432/protoverse?sslmode=disable"
      REDIS_ADDR: "redis:6379"
    ports:
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  tickengine:
    build:
      context: .
      target: tickengine
    environment:
      DB_URL: "postgres://postgres:devpass@postgres:5432/protoverse?sslmode=disable"
      REDIS_ADDR: "redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  protoverse_pgdata:
